version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: collatz-db
    environment:
      POSTGRES_DB: collatz
      POSTGRES_USER: collatz_user
      POSTGRES_PASSWORD: collatz_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collatz_user -d collatz"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: collatz-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://collatz_user:collatz_pass@db:5432/collatz
      FLASK_ENV: development
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: collatz-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
